spring.application.name=keys-api
spring.datasource.url=jdbc:postgresql://localhost:5432/db_keys
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
# quem lida com a criaÃ§Ã£o e atualizaÃ§Ã£o do banco agora Ã© o Flyway
spring.jpa.show-sql=true
spring.flyway.baseline-on-migrate=true
#exibe comandos sql no terminal
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Configurações MQTT
mqtt.broker=tcp://localhost:1883
mqtt.client-id=keys-spring-boot

#Envia instruções do spring boot para a placa esp8266
mqtt.topico.comando=keys/springboot/01/esp8266
#Envia o resultado das operações da placa para o spring boot
mqtt.topico.resposta=keys/esp8266/01/springboot

#Autenticação que permite o Spring Boot acessar o Mosquitto
mqtt.username=keys_back_end
mqtt.password=123456

app.jwt.secret=${JWT_SECRET:0ubMdHdE0iCDkRQ8hRpk3xkQB1Qz49yKO}
app.jwt.expiration-ms=86400000

spring.flyway.locations=classpath:db/migration
