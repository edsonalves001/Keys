spring.application.name=keys-api
spring.datasource.url=jdbc:postgresql://localhost:5432/db_keys
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
# quem lida com a criação e atualização do banco agora é o Flyway
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

app.jwt.secret=${JWT_SECRET:0ubMdHdE0iCDkRQ8hRpk3xkQB1Qz49yKO}
app.jwt.expiration-ms=86400000

spring.flyway.locations=classpath:db/migration
